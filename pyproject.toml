[project]
name = "ai-quantum"
version = "0.1.0"
description = "Quantum Machine learning by Qimono"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.2.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pennylane>=0.43.2",
    "pennylane-qiskit>=0.36.0",
    "pylatexenc>=2.10",
    "qiskit>=2.3.0",
    "qiskit-aer>=0.17.2",
    "qiskit-algorithms>=0.4.0",
    "qiskit-machine-learning>=0.9.0",
    "scikit-learn>=1.8.0",
    "stable-baselines3>=2.7.1",
    "tensorflow>=2.20.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]
[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.10.0",
]
